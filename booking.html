<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Book Your Edit | RJ Editing Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: 'Segoe UI', sans-serif;
    background-color: #eeeeee;
    color: #111;
}

/* CONTAINER */
.container {
    max-width: 720px;
    margin: 90px auto;
    padding: 50px;
    background: #ffffff;
    border-radius: 25px;
    box-shadow: 0 25px 60px rgba(0,0,0,0.05);
}

h1 {
    text-align: center;
    letter-spacing: 6px;
    margin-bottom: 45px;
}

/* FORM */
form {
    display: flex;
    flex-direction: column;
    gap: 22px;
}

input, select, textarea {
    padding: 15px;
    border-radius: 12px;
    border: 1px solid #ccc;
    font-size: 15px;
    outline: none;
    transition: 0.3s ease;
}

input:focus, textarea:focus, select:focus {
    border-color: #111;
}

textarea {
    resize: vertical;
    min-height: 120px;
}

button {
    margin-top: 10px;
    padding: 15px;
    background: #111;
    color: #fff;
    border: none;
    border-radius: 50px;
    font-weight: 600;
    letter-spacing: 2px;
    cursor: pointer;
    transition: all 0.3s ease;
}

button:hover {
    background: transparent;
    color: #111;
    border: 2px solid #111;
}

/* SUCCESS MESSAGE */
.success-box {
    margin-top: 50px;
    padding: 40px;
    background: #f5f5f5;
    border-radius: 20px;
    text-align: center;
    display: none;
    animation: fadeIn 0.8s ease forwards;
}

@keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
}

.success-icon {
    width: 55px;
    height: 55px;
    fill: #111;
    margin-bottom: 20px;
}

.success-box h2 {
    margin-bottom: 15px;
}

.success-box p {
    color: #555;
    font-size: 15px;
    line-height: 1.6;
}
</style>
</head>

<body>

<div class="container">
    <h1>BOOK YOUR EDIT</h1>

    <form id="bookingForm">
        <input type="text" placeholder="Full Name" required>
        <input type="email" id="emailField" placeholder="Email Address" required>

        <select required>
            <option value="">Select Service</option>
            <option>Cinematic Video Editing</option>
            <option>Professional Photo Edit works</option>
            <option>Advanced Color Grading</option>
            <option>Reels / Shorts Video Edits</option>
        </select>

        <textarea placeholder="Describe your project..." required></textarea>

        <input type="file" multiple required>

        <!-- Preferred Contact Method -->
        <select id="contactMethod" required>
            <option value="">Preferred Contact Method</option>
            <option value="Email">Email</option>
            <option value="WhatsApp">WhatsApp</option>
            <option value="Instagram DM">Instagram DM</option>
        </select>

        <button type="submit">Submit Project</button>
    </form>

    <div class="success-box" id="successBox">

        <!-- Black Filled Check Icon -->
        <svg class="success-icon" viewBox="0 0 24 24">
            <path d="M9 16.2l-3.5-3.5L4 14.2 9 19 20 8l-1.5-1.5z"/>
        </svg>

        <h2>We’ve Received Your Project</h2>
        <p id="successMessage"></p>

    </div>
</div>

<script>
document.getElementById("bookingForm").addEventListener("submit", function(e){
    e.preventDefault();

    const contact = document.getElementById("contactMethod").value;

    document.getElementById("successMessage").innerHTML =
        "Thank you for choosing RJ Editing Studio.<br><br>" +
        "We will contact you shortly via <strong>" + contact + "</strong>.<br>" +
        "Please check your " + contact + " for further updates.";

    document.getElementById("successBox").style.display = "block";

    window.scrollTo({
        top: document.body.scrollHeight,
        behavior: "smooth"
    });
});
</script>

</body>
</html>
